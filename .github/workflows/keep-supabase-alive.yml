name: Keep Supabase Alive

# ยิง query เข้า Supabase ทุกวัน กันโปรเจกต์ถูก pause อัตโนมัติ
# (Supabase free tier จะ pause เมื่อไม่มี activity เกิน 7 วัน)

on:
  schedule:
    # ทุกวัน 03:17 UTC (~10:17 น. เวลาไทย) — เลี่ยงเลขกลมๆ ลดโอกาส GitHub หน่วงคิว
    - cron: '17 3 * * *'
  workflow_dispatch:  # กดรันเองได้จากแท็บ Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query products table
        run: |
          SUPABASE_URL="https://obfvftmhyejbcbqhxnlh.supabase.co"
          ANON_KEY="sb_publishable_P97WCpAzyayF1v7I_UmLhQ_FJryHWII"

          echo "Pinging Supabase REST API..."
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response: $(cat /tmp/resp.txt)"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase is awake."
          else
            echo "❌ Unexpected status ${HTTP_CODE}"
            exit 1
          fi
